      <stop offset="50%" style="stop-color:#302b63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#24243e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#302b63;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0f0c29;stop-opacity:0.4" />
    </linearGradient>
  </defs>
  <!-- Background -->
