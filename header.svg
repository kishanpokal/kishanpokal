  <circle cx="50" cy="30" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="120" cy="60" r="1" fill="white" opacity="0.6"/>
  <circle cx="200" cy="20" r="2" fill="white" opacity="0.9"/>
  <circle cx="350" cy="45" r="1.5" fill="#a78bfa" opacity="0.8"/>
  <circle cx="500" cy="25" r="1" fill="white" opacity="0.7"/>
  <circle cx="650" cy="55" r="2" fill="#a78bfa" opacity="0.6"/>
  <circle cx="800" cy="30" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="950" cy="50" r="1" fill="white" opacity="0.5"/>
  <circle cx="1050" cy="20" r="2" fill="#a78bfa" opacity="0.9"/>
  <circle cx="1150" cy="40" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="1100" cy="70" r="1" fill="white" opacity="0.4"/>
  <circle cx="750" cy="15" r="1" fill="#a78bfa" opacity="0.7"/>
  <circle cx="300" cy="80" r="1" fill="white" opacity="0.5"/>
  <circle cx="880" cy="65" r="1.5" fill="white" opacity="0.6"/>
