  <!-- Subtitle -->
  <text x="600" y="135" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#d8b4fe" text-anchor="middle" letter-spacing="0.5">Android Developer  |  AI &amp; Data Science Enthusiast</text>
