        pre { 
          font-family: monospace; 
          font-size: 5.5px; 
          line-height: 5.5px; 
          color: #a78bfa; 
          background: transparent; 
          margin: 0; 
          overflow: hidden; 
          /* This creates the line-by-line typing animation */
          animation: printLine 2.5s steps(44, end) forwards;
        }
